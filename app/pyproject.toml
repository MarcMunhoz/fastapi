
[tool.poetry]
name = "fast-api"
version = "0.0.4"
description = "FastAPI boilerplate with Docker"
authors = ["Marcelo Munhoz <me@marcelomunhoz.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.1"
uvicorn = {extras = ["standard"], version = "^0.34.3"}

[tool.poetry.group.dev.dependencies]
pip-audit = "^2.10.0"
ruff = "^0.15.12"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
indent-width = 2
line-length = 79
extend-exclude = ["migrations", "venv"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
ignore = ["E111", "E114", "E117", "E305"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:warnings"
testpaths = ["tests"]