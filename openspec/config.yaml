schema: spec-driven

context: |
  This repository is a FastAPI application template. The application runs
  with Uvicorn on Python 3.12 (Alpine) using Docker and Docker Compose.
  The entry point is app/main.py. Poetry manages dependencies through
  app/pyproject.toml and app/poetry.lock.
  Tests use pytest under app/tests/. Ruff handles linting and formatting.
  The Makefile provides container lifecycle commands and a pip-audit target.
  Run application builds, dependency commands, and validation in the project
  container. Read RTK.md for repository workflow guidance.

rules:
  proposal:
    - State the intended outcome, affected capabilities, and scope.
  design:
    - Explain implementation decisions and compatibility implications where relevant.
  specs:
    - Describe observable requirements and scenarios for the affected capability.
    - Preserve existing requirements and scenarios outside the requested scope.
  tasks:
    - List implementation steps and directly relevant validation.
    - Keep workflow closure and external actions out of the task list.
